name: One-time M2.3 verified payload apply

on:
  push:
    branches:
      - feature/caibuwailu-m2-3-entitlements
    paths:
      - ".github/workflows/one-time-m2-3-apply.yml"

permissions:
  contents: write

concurrency:
  group: caibuwailu-m2-3-payload-apply
  cancel-in-progress: false

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M2.3 branch
        uses: actions/checkout@v4
        with:
          ref: feature/caibuwailu-m2-3-entitlements
          fetch-depth: 0

      - name: Publish apply run marker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_RUN_ID}" > .github/m2-3-apply-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/m2-3-apply-run.txt
          git commit -m "ci(m2.3): publish payload apply run id"
          git push origin HEAD:feature/caibuwailu-m2-3-entitlements

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/m2-3-payload/part-* | base64 --decode > /tmp/caibuwailu-m2-3-payload.tar.xz
          echo "760177deee1503e00da7dc16e729097db5d2a120928f0cfbb3f209cca1983070  /tmp/caibuwailu-m2-3-payload.tar.xz" | sha256sum --check
          tar -tJf /tmp/caibuwailu-m2-3-payload.tar.xz > /tmp/m2-3-payload-files.txt
          if grep -E '(^|/)\.\.(/|$)|^/' /tmp/m2-3-payload-files.txt; then
            echo "Unsafe path found in payload" >&2
            exit 1
          fi
          tar -xJf /tmp/caibuwailu-m2-3-payload.tar.xz -C .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Format and normalize M2.3 Python scope
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff format \
            app/api/v1/module_membership \
            app/api/v1/module_portal \
            app/api/v1/module_system/auth/service.py \
            app/core/dependencies.py \
            app/core/security.py \
            app/alembic/versions/20260823_01_caibuwailu_member_subscription.py \
            tests/test_api_module_membership_subscription.py \
            tests/test_portal_entitlement.py \
            tests/test_project_menu_seed.py
          uv run ruff check --fix --unsafe-fixes \
            app/api/v1/module_membership \
            app/api/v1/module_portal \
            app/api/v1/module_system/auth/service.py \
            app/core/dependencies.py \
            app/core/security.py \
            app/alembic/versions/20260823_01_caibuwailu_member_subscription.py \
            tests/test_api_module_membership_subscription.py \
            tests/test_portal_entitlement.py \
            tests/test_project_menu_seed.py

      - name: Remove non-workflow transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/m2-3-payload
          rm -f .github/m2-3-source-run.txt
          rm -f .github/m2-3-apply-run.txt
          rm -f .github/scripts/m2_exceljs_security_repair.py
          rm -f .github/workflows/caibuwailu-m2-3-ci.yml

      - name: Commit M2.3 source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git add -f \
            frontend/app/src/api/auth.ts \
            frontend/app/src/api/http.ts \
            frontend/app/src/api/portal.ts \
            frontend/app/src/mocks/portal.ts \
            frontend/app/src/pages.json \
            frontend/app/src/pages/academy/index.vue \
            frontend/app/src/pages/auth/login.vue \
            frontend/app/src/pages/content/detail.vue \
            frontend/app/src/pages/home/index.vue \
            frontend/app/src/pages/member/index.vue \
            frontend/app/src/pages/mine/index.vue \
            frontend/app/src/types/portal.ts \
            frontend/app/src/utils/auth.ts
          git diff --cached --check
          git commit -m "feat(m2.3): add real subscriptions and entitlement-protected portal"
          git push origin HEAD:feature/caibuwailu-m2-3-entitlements

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Generate deterministic app lockfile
        working-directory: frontend/app
        run: |
          corepack enable
          corepack prepare pnpm@9.9.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Commit app lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add -f frontend/app/pnpm-lock.yaml
          git diff --cached --check
          git commit -m "build(app): lock M2.3 user application dependencies"
          git push origin HEAD:feature/caibuwailu-m2-3-entitlements
