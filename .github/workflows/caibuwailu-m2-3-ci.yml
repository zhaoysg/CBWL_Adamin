name: 财不外露 M2.3 会员权益 CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/caibuwailu-m2-3-entitlements
    paths:
      - "backend/app/api/v1/module_membership/**"
      - "backend/app/api/v1/module_portal/**"
      - "backend/app/api/v1/module_system/auth/**"
      - "backend/app/core/dependencies.py"
      - "backend/app/core/security.py"
      - "backend/app/alembic/versions/20260823_01_caibuwailu_member_subscription.py"
      - "backend/sql/data/cw_menu.json"
      - "backend/tests/test_api_module_membership_subscription.py"
      - "backend/tests/test_portal_entitlement.py"
      - "backend/tests/test_project_menu_seed.py"
      - "frontend/web/src/api/module_membership/**"
      - "frontend/web/src/views/module_membership/**"
      - "frontend/app/**"
      - ".github/workflows/caibuwailu-m2-3-ci.yml"
  pull_request:
    branches:
      - feature/caibuwailu-m2-membership
    paths:
      - "backend/app/api/v1/module_membership/**"
      - "backend/app/api/v1/module_portal/**"
      - "backend/app/api/v1/module_system/auth/**"
      - "backend/app/core/dependencies.py"
      - "backend/app/core/security.py"
      - "backend/app/alembic/versions/20260823_01_caibuwailu_member_subscription.py"
      - "backend/sql/data/cw_menu.json"
      - "backend/tests/test_api_module_membership_subscription.py"
      - "backend/tests/test_portal_entitlement.py"
      - "backend/tests/test_project_menu_seed.py"
      - "frontend/web/src/api/module_membership/**"
      - "frontend/web/src/views/module_membership/**"
      - "frontend/app/**"
      - ".github/workflows/caibuwailu-m2-3-ci.yml"

permissions:
  contents: read

concurrency:
  group: caibuwailu-m2-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend entitlement, auth and SQLite gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Validate project menu JSON
        run: uv run python -m json.tool sql/data/cw_menu.json >/dev/null

      - name: Compile M2.3 modules and tests
        run: >-
          uv run python -m compileall -q
          app/api/v1/module_membership
          app/api/v1/module_portal
          app/api/v1/module_system/auth
          app/core/dependencies.py
          app/core/security.py
          app/alembic/versions/20260823_01_caibuwailu_member_subscription.py
          tests/test_api_module_membership_subscription.py
          tests/test_portal_entitlement.py
          tests/test_project_menu_seed.py

      - name: Ruff lint
        run: >-
          uv run ruff check --no-fix
          app/api/v1/module_membership
          app/api/v1/module_portal
          app/api/v1/module_system/auth/service.py
          app/core/dependencies.py
          app/core/security.py
          app/alembic/versions/20260823_01_caibuwailu_member_subscription.py
          tests/test_api_module_membership_subscription.py
          tests/test_portal_entitlement.py
          tests/test_project_menu_seed.py

      - name: Ruff format check
        run: >-
          uv run ruff format --check
          app/api/v1/module_membership
          app/api/v1/module_portal
          app/api/v1/module_system/auth/service.py
          app/core/dependencies.py
          app/core/security.py
          app/alembic/versions/20260823_01_caibuwailu_member_subscription.py
          tests/test_api_module_membership_subscription.py
          tests/test_portal_entitlement.py
          tests/test_project_menu_seed.py

      - name: Security scan changed backend domains
        run: >-
          uvx bandit -q -r
          app/api/v1/module_membership
          app/api/v1/module_portal
          app/api/v1/module_system/auth/service.py
          app/core/dependencies.py
          app/core/security.py

      - name: Run M2 and M2.3 API workflows
        env:
          PORTAL_DATA_SOURCE: database
        run: >-
          uv run pytest -q
          tests/test_api_module_content.py
          tests/test_api_module_membership_subscription.py
          tests/test_portal_entitlement.py
          tests/test_project_menu_seed.py

      - name: Run application smoke tests
        run: uv run pytest -q tests/test_main.py

      - name: SQLite migration round trip
        env:
          ENVIRONMENT: dev
          DATABASE_TYPE: sqlite
          DATABASE_NAME: /tmp/caibuwailu_m2_3_migration
          SECRET_KEY: ci-only-secret-key-not-for-production
        run: |
          rm -f /tmp/caibuwailu_m2_3_migration.db
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini downgrade base
          uv run alembic -c alembic.ini upgrade head

  admin-web-build:
    name: Administration typecheck, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.3 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck administration frontend
        run: pnpm run type-check

      - name: Build production administration frontend
        run: pnpm run build:prod

      - name: Audit full dependency graph
        run: pnpm audit --audit-level high

  app-h5-build:
    name: User app typecheck, production H5 and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.9.0 --activate

      - name: Require deterministic app lockfile
        run: test -f pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck user application
        run: pnpm run type-check

      - name: Build production H5 without mocks
        env:
          VITE_USE_MOCK: "false"
          VITE_API_BASE_URL: /api/v1
        run: pnpm run build:h5

      - name: Audit full dependency graph
        run: pnpm audit --audit-level high

      - name: Upload H5 acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: caibuwailu-m2-3-h5
          path: frontend/app/dist/build/h5
          if-no-files-found: error
          retention-days: 7

  mysql-migration:
    name: MySQL 8.4 subscription migration round trip
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: caibuwailu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: dev
      DATABASE_TYPE: mysql
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: caibuwailu
      SECRET_KEY: ci-only-secret-key-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Create existing-system user fixture
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("mysql+pymysql://root:root@127.0.0.1:3306/caibuwailu")
          with engine.begin() as connection:
              connection.execute(text("CREATE TABLE IF NOT EXISTS sys_user (id INT PRIMARY KEY) ENGINE=InnoDB"))
          PY

      - name: Upgrade, downgrade and re-upgrade
        run: |
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini downgrade base
          uv run alembic -c alembic.ini upgrade head

      - name: Assert subscription table
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, inspect
          engine = create_engine("mysql+pymysql://root:root@127.0.0.1:3306/caibuwailu")
          actual = set(inspect(engine).get_table_names())
          assert "cw_member_subscription" in actual
          PY

  postgres-migration:
    name: PostgreSQL 16 subscription migration round trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caibuwailu
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d caibuwailu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: dev
      DATABASE_TYPE: postgres
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: caibuwailu
      SECRET_KEY: ci-only-secret-key-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Create existing-system user fixture
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql+psycopg://postgres:postgres@127.0.0.1:5432/caibuwailu")
          with engine.begin() as connection:
              connection.execute(text("CREATE TABLE IF NOT EXISTS sys_user (id INTEGER PRIMARY KEY)"))
          PY

      - name: Upgrade, downgrade and re-upgrade
        run: |
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini downgrade base
          uv run alembic -c alembic.ini upgrade head

      - name: Assert subscription table
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, inspect
          engine = create_engine("postgresql+psycopg://postgres:postgres@127.0.0.1:5432/caibuwailu")
          actual = set(inspect(engine).get_table_names())
          assert "cw_member_subscription" in actual
          PY
