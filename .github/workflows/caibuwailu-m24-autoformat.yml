name: 财不外露 M2.4 一次性模型注册格式化

on:
  push:
    branches:
      - feature/caibuwailu-m2-4-order-payment
    paths:
      - ".github/workflows/caibuwailu-m24-autoformat.yml"

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/caibuwailu-m2-4-order-payment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Apply repository Ruff formatter
        working-directory: backend
        run: >-
          uv run ruff format
          app/utils/import_util.py
          tests/test_module_billing_models.py

      - name: Commit formatted files and remove one-time runner
        run: |
          git rm .github/workflows/caibuwailu-m24-autoformat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/utils/import_util.py \
            backend/tests/test_module_billing_models.py
          git commit -m "style(core): format two-pass model registry"
          git push origin HEAD:feature/caibuwailu-m2-4-order-payment
