name: 财不外露 M2 正式闸门恢复（临时）

on:
  pull_request:
    branches:
      - feature/caibuwailu-m1
    paths:
      - ".github/workflows/caibuwailu-m2-ci.yml"

permissions:
  contents: write

concurrency:
  group: caibuwailu-m2-gate-restore-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore verified production M2 workflow
        run: >-
          git show
          9594f1dd30a000af8a721341d0a1a8f5426fe51f:.github/workflows/caibuwailu-m2-ci.yml
          > .github/workflows/caibuwailu-m2-ci.yml

      - name: Commit restored quality gates
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/caibuwailu-m2-ci.yml
          git commit -m "ci(m2): restore production quality gates after formatting repair"
          git pull --rebase origin ${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
