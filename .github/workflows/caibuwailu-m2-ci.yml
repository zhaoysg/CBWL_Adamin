name: 财不外露 M2 依赖修复（临时）

on:
  pull_request:
    branches:
      - feature/caibuwailu-m1
    paths:
      - ".github/workflows/caibuwailu-m2-ci.yml"

permissions:
  contents: write

concurrency:
  group: caibuwailu-m2-dependency-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.3 --activate

      - name: Verify SheetJS runtime imports were removed
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = "frontend/web/src";
          const importPattern = /(?:from\s+|require\(\s*)["']xlsx["']/;
          const findings = [];

          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                walk(target);
              } else if (/\.(?:ts|tsx|js|jsx|vue)$/.test(entry.name)) {
                const content = fs.readFileSync(target, "utf8");
                if (importPattern.test(content)) findings.push(target);
              }
            }
          }

          walk(root);
          if (findings.length) {
            console.error("SheetJS imports remain:", findings);
            process.exit(1);
          }
          NODE

      - name: Apply dependency and bundler security policy
        working-directory: frontend/web
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const packagePath = "package.json";
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));

          delete pkg.dependencies.xlsx;
          pkg.dependencies.axios = "^1.18.0";
          pkg.dependencies["markdown-it"] = "^14.1.1";
          pkg.devDependencies.vite = "^7.3.5";
          pkg.devDependencies.postcss = "^8.5.18";

          for (const dependency of ["@tailwindcss/vite", "tailwindcss"]) {
            if (pkg.dependencies[dependency]) {
              pkg.devDependencies[dependency] = pkg.dependencies[dependency];
              delete pkg.dependencies[dependency];
            }
          }

          pkg.pnpm ??= {};
          pkg.pnpm.overrides = {
            ...(pkg.pnpm.overrides ?? {}),
            axios: "1.18.0",
            "form-data": "4.0.6",
            "linkify-it": "5.0.2",
            postcss: "8.5.18",
            vite: "7.3.5",
            tmp: "0.2.6",
            immutable: "5.1.8",
            "nanoid@3.3.12": "3.3.18",
            "nanoid@5.1.11": "5.1.16",
            "brace-expansion@2.1.0": "2.1.4",
            "brace-expansion@5.0.6": "5.0.9"
          };

          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + "\n");

          const vitePath = "vite.config.ts";
          let viteConfig = fs.readFileSync(vitePath, "utf8");
          viteConfig = viteConfig.replace(
            /^\s*if \(id\.includes\("xlsx"\)\) return "xlsx";\r?\n/m,
            ""
          );
          viteConfig = viteConfig.replace(/^\s*"xlsx",\r?\n/m, "");

          if (viteConfig.includes('id.includes("xlsx")') || /^\s*["']xlsx["'],?\s*$/m.test(viteConfig)) {
            throw new Error("Vite configuration still references the removed xlsx package");
          }
          fs.writeFileSync(vitePath, viteConfig);
          NODE

      - name: Refresh deterministic lockfile
        working-directory: frontend/web
        run: |
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Format migrated frontend files
        working-directory: frontend/web
        run: >-
          pnpm exec prettier --write
          package.json
          vite.config.ts
          src/components/forms/fa-excel-import/index.vue
          src/components/forms/fa-excel-export/index.vue

      - name: Validate dependency removal
        working-directory: frontend/web
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (pkg.dependencies.xlsx || pkg.devDependencies.xlsx) {
            throw new Error("xlsx remains declared in package.json");
          }
          const lockfile = fs.readFileSync("pnpm-lock.yaml", "utf8");
          if (/^\s{2}xlsx:/m.test(lockfile) || /^\s{2}xlsx@/m.test(lockfile) || /\/xlsx@/m.test(lockfile)) {
            throw new Error("xlsx remains in pnpm-lock.yaml");
          }
          NODE

      - name: Validate frontend and complete dependency graph
        working-directory: frontend/web
        run: |
          pnpm run type-check
          pnpm run build:prod
          pnpm audit --audit-level high

      - name: Commit verified dependency repairs
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/web/package.json \
            frontend/web/pnpm-lock.yaml \
            frontend/web/vite.config.ts \
            frontend/web/src/components/forms/fa-excel-import/index.vue \
            frontend/web/src/components/forms/fa-excel-export/index.vue
          if git diff --cached --quiet; then
            echo "Dependency policy already applied."
            exit 0
          fi
          git commit -m "fix(web): replace vulnerable SheetJS dependency"
          git pull --rebase origin ${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
