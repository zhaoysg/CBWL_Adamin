name: 财不外露 M2 临时格式化快照

on:
  push:
    branches:
      - feature/caibuwailu-m2-membership
    paths:
      - ".github/workflows/caibuwailu-m2-format-snapshot.yml"
  pull_request:
    branches:
      - feature/caibuwailu-m1
    paths:
      - ".github/workflows/caibuwailu-m2-format-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/caibuwailu-m2-membership

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Format M2 backend files
        run: >-
          uv run ruff format
          app/api/v1/module_content
          app/api/v1/module_membership
          app/alembic/versions/20260822_01_caibuwailu_content_admin.py
          tests/test_api_module_content.py
          app/init_app.py

      - name: Commit formatted files on branch push
        if: github.event_name == 'push'
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/v1/module_content \
            backend/app/api/v1/module_membership \
            backend/app/alembic/versions/20260822_01_caibuwailu_content_admin.py \
            backend/tests/test_api_module_content.py \
            backend/app/init_app.py
          git commit -m "style(m2): apply ruff formatting"
          git push origin HEAD:feature/caibuwailu-m2-membership

      - name: Package formatted files
        run: |
          tar -czf /tmp/caibuwailu-m2-formatted.tar.gz \
            app/api/v1/module_content \
            app/api/v1/module_membership \
            app/alembic/versions/20260822_01_caibuwailu_content_admin.py \
            tests/test_api_module_content.py \
            app/init_app.py

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: caibuwailu-m2-formatted
          path: /tmp/caibuwailu-m2-formatted.tar.gz
          if-no-files-found: error
          retention-days: 1
