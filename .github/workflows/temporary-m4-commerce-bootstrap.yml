name: Temporary M4 commerce bootstrap

on:
  push:
    branches:
      - feature/m4-commerce-order-payment-expand
    paths:
      - ".github/workflows/temporary-m4-commerce-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m4-commerce-order-payment-expand
          fetch-depth: 0

      - name: Reconstruct and verify reviewed M4 bundle
        run: |
          cat .github/m4-bootstrap/part-*.b64 \
            | tr -d '\n\r\t ' \
            | base64 -d > /tmp/m4files.tar.gz
          echo "98e943eba26d63e5df0a47ae051c9c52cb2981286331454d31a8b140d434f354  /tmp/m4files.tar.gz" \
            | sha256sum -c -
          test "$(tar -tzf /tmp/m4files.tar.gz | grep -Ec '(^/|(^|/)\.\.(/|$))')" -eq 0
          tar -xzf /tmp/m4files.tar.gz
          rm .github/workflows/caibuwailu-m4-commerce-order-payment-expand-ci.yml
          rm -rf .github/m4-bootstrap
          rm .github/workflows/temporary-m4-commerce-bootstrap.yml

      - name: Commit reviewed non-workflow M4 files atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(commerce): establish reversible order and payment ownership"
          git push origin HEAD:feature/m4-commerce-order-payment-expand
