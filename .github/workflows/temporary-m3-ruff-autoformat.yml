name: Temporary M3 Ruff autoformat

on:
  push:
    branches:
      - feature/m3-portal-customer-auth-dual
    paths:
      - ".github/workflows/temporary-m3-ruff-autoformat.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-portal-customer-auth-dual

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - working-directory: backend
        run: uv sync --frozen

      - name: Apply repository Ruff formatter
        working-directory: backend
        run: >-
          uv run ruff format
          app/config/portal_auth.py
          app/api/v1/module_portal/auth_schema.py
          app/api/v1/module_portal/auth_service.py
          app/api/v1/module_portal/auth_dependency.py
          app/api/v1/module_portal/customer_auth.py
          tests/test_portal_auth.py
          tests/test_portal_customer_auth_dual.py
          tests/mysql/verify_portal_customer_auth_dual.py

      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            echo "Ruff formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/config/portal_auth.py \
            backend/app/api/v1/module_portal/auth_schema.py \
            backend/app/api/v1/module_portal/auth_service.py \
            backend/app/api/v1/module_portal/auth_dependency.py \
            backend/app/api/v1/module_portal/customer_auth.py \
            backend/tests/test_portal_auth.py \
            backend/tests/test_portal_customer_auth_dual.py \
            backend/tests/mysql/verify_portal_customer_auth_dual.py
          git commit -m "style(portal): apply customer auth Ruff formatting"
          git push origin HEAD:feature/m3-portal-customer-auth-dual
