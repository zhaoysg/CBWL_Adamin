name: 财不外露临时格式化初始化脚本

on:
  push:
    branches:
      - feature/caibuwailu-m2-membership
    paths:
      - ".github/workflows/caibuwailu-format-initialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/caibuwailu-m2-membership

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Format initializer
        working-directory: backend
        run: uv run ruff format app/scripts/initialize.py

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/scripts/initialize.py
          git commit -m "style(m2): format project menu initializer"
          git push origin HEAD:feature/caibuwailu-m2-membership
