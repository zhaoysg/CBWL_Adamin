name: Temporary contract readiness format

on:
  push:
    branches:
      - feature/m3-customer-contract-readiness
    paths:
      - ".github/workflows/temporary-contract-readiness-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-customer-contract-readiness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - working-directory: backend
        run: uv sync --frozen
      - name: Format readiness files
        working-directory: backend
        run: >-
          uv run ruff format
          app/api/v1/module_identity/contract
          app/scripts/check_customer_contract_readiness.py
          tests/test_customer_contract_readiness.py
          tests/mysql/verify_customer_contract_readiness.py
      - name: Commit when changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/api/v1/module_identity/contract \
            backend/app/scripts/check_customer_contract_readiness.py \
            backend/tests/test_customer_contract_readiness.py \
            backend/tests/mysql/verify_customer_contract_readiness.py
          git commit -m "style(identity): format contract readiness files"
          git push origin HEAD:feature/m3-customer-contract-readiness
