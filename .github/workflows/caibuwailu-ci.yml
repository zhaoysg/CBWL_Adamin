name: 财不外露 CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/caibuwailu-m1
    paths:
      - "backend/app/api/v1/module_portal/**"
      - "backend/contract_tests/test_portal_service.py"
      - "frontend/app/**"
      - ".github/workflows/caibuwailu-ci.yml"
  pull_request:
    branches:
      - master
    paths:
      - "backend/app/api/v1/module_portal/**"
      - "backend/contract_tests/test_portal_service.py"
      - "frontend/app/**"
      - ".github/workflows/caibuwailu-ci.yml"

permissions:
  contents: read

jobs:
  portal-contract:
    name: Portal API contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Compile Portal module
        run: uv run --directory backend python -m compileall -q app/api/v1/module_portal

      - name: Run Portal contract tests
        run: uv run --directory backend pytest -q contract_tests/test_portal_service.py

  h5-build:
    name: H5 typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.3 --activate

      - name: Install mobile dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend/app
        run: pnpm run type-check

      - name: Build H5 production package
        working-directory: frontend/app
        run: pnpm run build:h5

      - name: Build H5 acceptance package
        working-directory: frontend/app
        run: pnpm run build:h5:acceptance

      - name: Upload H5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: caibuwailu-h5
          path: frontend/app/dist/build/h5
          if-no-files-found: error
          retention-days: 7
