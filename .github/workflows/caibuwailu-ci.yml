name: 财不外露 CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/caibuwailu-m1
    paths:
      - "backend/app/api/v1/module_portal/**"
      - "backend/contract_tests/test_portal_service.py"
      - "frontend/app/**"
      - ".github/workflows/caibuwailu-ci.yml"
  pull_request:
    branches:
      - master
    paths:
      - "backend/app/api/v1/module_portal/**"
      - "backend/contract_tests/test_portal_service.py"
      - "frontend/app/**"
      - ".github/workflows/caibuwailu-ci.yml"

permissions:
  contents: read

jobs:
  portal-contract:
    name: Portal API contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract test dependencies
        run: |
          python -m pip install --upgrade \
            "fastapi==0.138.2" \
            "httpx==0.28.1" \
            "pydantic[email]>=2.12.5,<3" \
            "pydantic-settings>=2.6.1,<3" \
            "pytest==9.0.2" \
            "pytest-asyncio>=0.24.0,<2"

      - name: Compile Portal module
        run: python -m compileall -q backend/app/api/v1/module_portal

      - name: Run Portal contract tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/contract_tests/test_portal_service.py

  h5-build:
    name: H5 typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.9.0 --activate

      - name: Install mobile dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend/app
        run: pnpm run type-check

      - name: Build H5 production package
        working-directory: frontend/app
        run: pnpm run build:h5

      - name: Build H5 acceptance package
        working-directory: frontend/app
        run: pnpm run build:h5:acceptance

      - name: Upload H5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: caibuwailu-h5
          path: frontend/app/dist/build/h5
          if-no-files-found: error
          retention-days: 7
