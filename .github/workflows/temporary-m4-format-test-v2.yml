name: Temporary M4 permanent precision fix v6

on:
  push:
    branches:
      - feature/m4-commerce-order-payment-expand
    paths:
      - ".github/workflows/temporary-m4-format-test-v2.yml"

permissions:
  contents: write

concurrency:
  group: temporary-m4-permanent-precision-fix
  cancel-in-progress: true

jobs:
  fix-format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: caibuwailu
          MYSQL_USER: caibuwailu
          MYSQL_PASSWORD: caibuwailu-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ENVIRONMENT: dev
      DATABASE_TYPE: mysql
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: caibuwailu
      DATABASE_PASSWORD: caibuwailu-ci
      DATABASE_NAME: caibuwailu
      SECRET_KEY: ci-only-secret-key-not-for-production
      REDIS_HOST: 127.0.0.1
      PORTAL_IDENTITY_MODE: dual
      PORTAL_ENTITLEMENT_MODE: dual
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m4-commerce-order-payment-expand
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Apply permanent DATETIME(6) and metadata-index fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          MODEL = Path("backend/app/api/v1/module_commerce/model.py")
          MIGRATION = Path(
              "backend/app/alembic/versions/20260903_02_commerce_order_payment_expand.py"
          )
          MYSQL_TEST = Path(
              "backend/tests/mysql/verify_commerce_order_payment_expand.py"
          )

          def replace_once(path: Path, old: str, new: str) -> None:
              content = path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"expected one match in {path}, found {count}: {old!r}"
                  )
              path.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              MODEL,
              ")\nfrom sqlalchemy.orm import Mapped, mapped_column, relationship\n",
              ")\nfrom sqlalchemy.dialects import mysql\n"
              "from sqlalchemy.orm import Mapped, mapped_column, relationship\n",
          )
          replace_once(
              MODEL,
              "    occurred_at: Mapped[datetime] = mapped_column(\n"
              "        DateTime(timezone=True),\n"
              "        nullable=False,\n"
              "        comment=\"支付提供方事件发生时间\",\n"
              "    )\n",
              "    occurred_at: Mapped[datetime] = mapped_column(\n"
              "        DateTime(timezone=True).with_variant(\n"
              "            mysql.DATETIME(fsp=6),\n"
              "            \"mysql\",\n"
              "        ),\n"
              "        nullable=False,\n"
              "        comment=\"支付提供方事件发生时间\",\n"
              "    )\n",
          )
          for table_name in (
              "cw_order",
              "cw_payment_attempt",
              "cw_payment_event",
          ):
              replace_once(
                  MODEL,
                  f'        Index("ix_{table_name}_is_deleted", "is_deleted"),\n'
                  f'        Index("ix_{table_name}_created_time", "created_time"),\n',
                  "",
              )

          replace_once(
              MIGRATION,
              "import sqlalchemy as sa\nfrom alembic import op\n",
              "import sqlalchemy as sa\nfrom alembic import op\n"
              "from sqlalchemy.dialects import mysql\n",
          )
          replace_once(
              MIGRATION,
              '        sa.Column("occurred_at", sa.DateTime(timezone=True), nullable=False),\n',
              "        sa.Column(\n"
              "            \"occurred_at\",\n"
              "            sa.DateTime(timezone=True).with_variant(\n"
              "                mysql.DATETIME(fsp=6),\n"
              "                \"mysql\",\n"
              "            ),\n"
              "            nullable=False,\n"
              "        ),\n",
          )

          replace_once(
              MYSQL_TEST,
              "        expired_at = datetime.now(UTC) - timedelta(minutes=1)\n",
              "        expired_at = (datetime.now(UTC) - timedelta(minutes=1)).replace(\n"
              "            microsecond=123456\n"
              "        )\n",
          )
          replace_once(
              MYSQL_TEST,
              "        assert paid.payment_attempt.status == \"succeeded\"\n\n"
              "        duplicate = await service.record_verified_payment_event(success_payload)\n"
              "        assert duplicate.event.id == paid.event.id\n"
              "        assert duplicate.order.version_no == paid.order.version_no\n"
              "        assert duplicate.payment_attempt.version_no == paid.payment_attempt.version_no\n",
              "        assert paid.payment_attempt.status == \"succeeded\"\n\n"
              "        paid_event_id = paid.event.id\n"
              "        paid_order_version = paid.order.version_no\n"
              "        paid_attempt_version = paid.payment_attempt.version_no\n"
              "        await db.flush()\n"
              "        db.expire_all()\n"
              "        persisted_event = await db.scalar(\n"
              "            select(PaymentEventModel).where(\n"
              "                PaymentEventModel.id == paid_event_id\n"
              "            )\n"
              "        )\n"
              "        assert persisted_event is not None\n"
              "        assert persisted_event.occurred_at.microsecond == 123456\n\n"
              "        duplicate = await service.record_verified_payment_event(success_payload)\n"
              "        assert duplicate.event.id == paid_event_id\n"
              "        assert duplicate.order.version_no == paid_order_version\n"
              "        assert duplicate.payment_attempt.version_no == paid_attempt_version\n",
          )
          replace_once(
              MYSQL_TEST,
              "        referential_actions = connection.execute(\n"
              "            text(\n"
              "                \"SELECT CONSTRAINT_NAME, UPDATE_RULE, DELETE_RULE \"\n"
              "                \"FROM information_schema.REFERENTIAL_CONSTRAINTS \"\n"
              "                \"WHERE CONSTRAINT_SCHEMA = DATABASE() \"\n"
              "                \"AND TABLE_NAME IN (\"\n"
              "                \"'cw_order', 'cw_payment_attempt', 'cw_payment_event'\"\n"
              "                \")\"\n"
              "            )\n"
              "        ).all()\n"
              "    collations = dict(rows)\n",
              "        referential_actions = connection.execute(\n"
              "            text(\n"
              "                \"SELECT CONSTRAINT_NAME, UPDATE_RULE, DELETE_RULE \"\n"
              "                \"FROM information_schema.REFERENTIAL_CONSTRAINTS \"\n"
              "                \"WHERE CONSTRAINT_SCHEMA = DATABASE() \"\n"
              "                \"AND TABLE_NAME IN (\"\n"
              "                \"'cw_order', 'cw_payment_attempt', 'cw_payment_event'\"\n"
              "                \")\"\n"
              "            )\n"
              "        ).all()\n"
              "        occurred_at_precision = connection.execute(\n"
              "            text(\n"
              "                \"SELECT DATETIME_PRECISION \"\n"
              "                \"FROM information_schema.COLUMNS \"\n"
              "                \"WHERE TABLE_SCHEMA = DATABASE() \"\n"
              "                \"AND TABLE_NAME = 'cw_payment_event' \"\n"
              "                \"AND COLUMN_NAME = 'occurred_at'\"\n"
              "            )\n"
              "        ).scalar_one()\n"
              "    collations = dict(rows)\n",
          )
          replace_once(
              MYSQL_TEST,
              "    assert set(collations.values()) == {\"utf8mb4_bin\"}\n"
              "    assert referential_actions\n",
              "    assert set(collations.values()) == {\"utf8mb4_bin\"}\n"
              "    assert occurred_at_precision == 6\n"
              "    assert referential_actions\n",
          )
          PY

      - name: Require one canonical commerce implementation
        run: |
          test ! -d backend/app/api/v1/module_commerce/order_payment
          test ! -f backend/tests/test_commerce_order_payment_expand.py

      - name: Apply and verify repository Ruff rules
        working-directory: backend
        run: |
          uv run ruff check --fix \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run ruff format \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run python -m compileall -q \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run ruff check --no-fix \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run ruff format --check \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py

      - name: Run SQLite commerce service contracts
        working-directory: backend
        env:
          DATABASE_TYPE: sqlite
        run: uv run pytest -q tests/test_commerce_order_payment.py

      - name: Create existing system identity boundary
        working-directory: backend
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.config.setting import settings

          engine = create_engine(settings.DB_URI)
          with engine.begin() as connection:
              connection.execute(
                  text(
                      "CREATE TABLE sys_user ("
                      "id INT PRIMARY KEY, "
                      "is_deleted BOOLEAN NOT NULL DEFAULT FALSE"
                      ") ENGINE=InnoDB"
                  )
              )
          engine.dispose()
          PY

      - name: Upgrade and verify on MySQL 8.4
        working-directory: backend
        run: |
          test "$(uv run alembic -c alembic.ini heads | wc -l)" -eq 1
          uv run alembic -c alembic.ini upgrade head
          uv run python -m tests.mysql.verify_commerce_order_payment_expand
          uv run alembic -c alembic.ini downgrade 20260903_01
          uv run python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from app.config.setting import settings

          engine = create_engine(settings.DB_URI)
          tables = set(inspect(engine).get_table_names())
          assert "cw_order" not in tables
          assert "cw_payment_attempt" not in tables
          assert "cw_payment_event" not in tables
          assert "cw_customer" in tables
          assert "cw_member_subscription" in tables
          engine.dispose()
          PY
          uv run alembic -c alembic.ini upgrade head
          uv run python -m tests.mysql.verify_commerce_order_payment_expand

      - name: Commit verified permanent implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/api/v1/module_commerce/model.py \
            backend/app/api/v1/module_commerce/service.py \
            backend/app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            backend/tests/test_commerce_order_payment.py \
            backend/tests/mysql/verify_commerce_order_payment_expand.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(commerce): preserve callback timestamp precision"
          git push origin HEAD:feature/m4-commerce-order-payment-expand
