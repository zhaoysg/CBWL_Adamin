name: Temporary M4 format and canonical test v4

on:
  push:
    branches:
      - feature/m4-commerce-order-payment-expand
    paths:
      - ".github/workflows/temporary-m4-format-test-v2.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m4-commerce-order-payment-expand
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Apply deterministic callback-time and test fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              content = path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"expected one match in {path}, found {count}: {old!r}"
                  )
              path.write_text(content.replace(old, new), encoding="utf-8")

          service = Path("backend/app/api/v1/module_commerce/service.py")
          unit_test = Path("backend/tests/test_commerce_order_payment.py")

          replace_once(
              unit_test,
              "customer, mapped_legacy, subject, first_plan, second_plan",
              "customer, mapped_legacy, _subject, first_plan, second_plan",
          )
          replace_once(
              service,
              "            occurred_at=as_utc(data.occurred_at),",
              "            occurred_at=self._event_time(data.occurred_at),",
          )
          replace_once(
              service,
              "            occurred_at = as_utc(data.occurred_at)",
              "            occurred_at = cls._event_time(data.occurred_at)",
          )
          replace_once(
              service,
              "            or as_utc(existing.occurred_at) != as_utc(data.occurred_at)",
              "            or CommerceService._event_time(existing.occurred_at)\n"
              "            != CommerceService._event_time(data.occurred_at)",
          )

          anchor = "    @staticmethod\n    def _new_number(prefix: str) -> str:\n"
          helper = (
              "    @staticmethod\n"
              "    def _event_time(value: datetime) -> datetime:\n"
              "        \"\"\"Normalize provider timestamps to stable DB precision.\"\"\"\n\n"
              "        return as_utc(value).replace(microsecond=0)\n\n"
          )
          replace_once(service, anchor, helper + anchor)
          PY

      - name: Require one canonical commerce implementation
        run: |
          test ! -d backend/app/api/v1/module_commerce/order_payment
          test ! -f backend/tests/test_commerce_order_payment_expand.py

      - name: Apply repository Ruff rules
        working-directory: backend
        run: |
          uv run ruff check --fix \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run ruff format \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py

      - name: Verify canonical commerce service
        working-directory: backend
        run: |
          uv run python -m compileall -q \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run ruff check --no-fix \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run ruff format --check \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run pytest -q tests/test_commerce_order_payment.py

      - name: Commit verified canonical implementation
        run: |
          rm -f .github/workflows/temporary-m4-format-test-v2.yml
          rm -f .github/workflows/temporary-m4-consolidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(commerce): normalize callback time and verify canonical state machine"
          git push origin HEAD:feature/m4-commerce-order-payment-expand
