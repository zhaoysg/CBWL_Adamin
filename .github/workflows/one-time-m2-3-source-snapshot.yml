name: One-time M2.3 source snapshot

on:
  push:
    branches:
      - feature/caibuwailu-m2-3-entitlements
    paths:
      - ".github/workflows/one-time-m2-3-source-snapshot.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/caibuwailu-m2-3-entitlements
          fetch-depth: 1

      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude='**/node_modules' \
            --exclude='**/.venv' \
            --exclude='**/dist' \
            --exclude='**/__pycache__' \
            -czf /tmp/caibuwailu-m2-3-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: caibuwailu-m2-3-source
          path: /tmp/caibuwailu-m2-3-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish workflow run marker
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" > .github/m2-3-source-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/m2-3-source-run.txt
          git commit -m "ci(m2.3): publish source snapshot run id"
          git push origin HEAD:feature/caibuwailu-m2-3-entitlements
