name: Temporary M4 consolidate commerce module

on:
  push:
    branches:
      - feature/m4-commerce-order-payment-expand
    paths:
      - ".github/workflows/temporary-m4-consolidate.yml"

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m4-commerce-order-payment-expand
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Sync locked dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Remove superseded duplicate implementation
        run: |
          rm -rf backend/app/api/v1/module_commerce/order_payment
          rm -f backend/tests/test_commerce_order_payment_expand.py
          cat > backend/app/api/v1/module_commerce/__init__.py <<'PY'
          """Commerce domain transaction foundation.

          M4 exposes one canonical order/payment implementation. Public Portal,
          management and provider controllers are added in later stacked changes.
          """

          from .schema import (
              CommerceOrderCancelSchema,
              CommerceOrderCreateSchema,
              CommerceOrderOutSchema,
              PaymentAttemptCreateSchema,
              PaymentAttemptOutSchema,
              PaymentEventOutSchema,
              PaymentEventResultSchema,
              VerifiedPaymentEventSchema,
          )
          from .service import CommerceService

          __all__ = [
              "CommerceOrderCancelSchema",
              "CommerceOrderCreateSchema",
              "CommerceOrderOutSchema",
              "CommerceService",
              "PaymentAttemptCreateSchema",
              "PaymentAttemptOutSchema",
              "PaymentEventOutSchema",
              "PaymentEventResultSchema",
              "VerifiedPaymentEventSchema",
          ]
          PY

      - name: Apply deterministic lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/mysql/verify_commerce_order_payment_expand.py")
          text = path.read_text(encoding="utf-8")
          old = "collations = {name: collation for name, collation in rows}"
          if old not in text:
              raise SystemExit("expected collation comprehension not found")
          path.write_text(text.replace(old, "collations = dict(rows)"), encoding="utf-8")
          PY
          cd backend
          uv run ruff check --fix \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run ruff format \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py

      - name: Verify canonical module before commit
        working-directory: backend
        run: |
          ! grep -R "module_commerce.order_payment" -n app tests
          uv run python -m compileall -q \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run ruff check --no-fix \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run ruff format --check \
            app/api/v1/module_commerce \
            app/alembic/versions/20260903_02_commerce_order_payment_expand.py \
            tests/test_commerce_order_payment.py \
            tests/mysql/verify_commerce_order_payment_expand.py
          uv run pytest -q tests/test_commerce_order_payment.py

      - name: Commit consolidated implementation and remove temporary workflow
        run: |
          rm -f .github/workflows/temporary-m4-consolidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(commerce): consolidate canonical order payment module"
          git push origin HEAD:feature/m4-commerce-order-payment-expand
