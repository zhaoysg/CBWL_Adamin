name: Refresh backend lock (temporary)

on:
  push:
    branches:
      - feature/h5-platform-auth-mysql
    paths:
      - "backend/pyproject.toml"
      - ".github/workflows/refresh-backend-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-backend-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/h5-platform-auth-mysql
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Regenerate lockfile
        working-directory: backend
        run: uv lock

      - name: Verify frozen install includes MySQL RSA support
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python -c "import cryptography; print(cryptography.__version__)"

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- backend/uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "chore(deps): refresh backend uv lock"
          git push origin HEAD:feature/h5-platform-auth-mysql
