name: Temporary M2 Ruff autoformat

on:
  push:
    branches:
      - feature/m2-customer-membership-expand
    paths:
      - ".github/workflows/temporary-m2-ruff-autoformat.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-customer-membership-expand

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - working-directory: backend
        run: uv sync --frozen

      - name: Apply repository Ruff formatter
        working-directory: backend
        run: >-
          uv run ruff format
          app/api/v1/module_identity/legacy
          app/api/v1/module_membership/subscription/model.py
          app/alembic/versions/20260903_01_customer_membership_expand.py
          tests/test_customer_membership_expand.py

      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            echo "Ruff formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/api/v1/module_identity/legacy \
            backend/app/api/v1/module_membership/subscription/model.py \
            backend/app/alembic/versions/20260903_01_customer_membership_expand.py \
            backend/tests/test_customer_membership_expand.py
          git commit -m "style(membership): apply Ruff formatting"
          git push origin HEAD:feature/m2-customer-membership-expand
