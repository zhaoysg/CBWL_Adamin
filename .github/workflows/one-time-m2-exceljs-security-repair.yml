name: 财不外露 M2 ExcelJS 安全修复（临时）

on:
  push:
    branches:
      - feature/caibuwailu-m2-membership
    paths:
      - ".github/workflows/one-time-m2-exceljs-security-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caibuwailu-m2-exceljs-security-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M2 branch
        uses: actions/checkout@v4
        with:
          ref: feature/caibuwailu-m2-membership
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.3 --activate

      - name: Apply ExcelJS migration and dependency policy
        run: python .github/scripts/m2_exceljs_security_repair.py

      - name: Extend permanent M2 CI coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/caibuwailu-m2-ci.yml')
          text = path.read_text(encoding='utf-8')
          additions = [
              '      - "frontend/web/package.json"',
              '      - "frontend/web/pnpm-lock.yaml"',
              '      - "frontend/web/src/components/forms/fa-excel-import/**"',
              '      - "frontend/web/src/components/forms/fa-excel-export/**"',
          ]
          anchor = '      - "frontend/web/src/views/module_membership/**"'
          for line in additions:
              if line not in text:
                  text = text.replace(anchor, anchor + '\n' + line)
          text = text.replace('pnpm audit --prod --audit-level high', 'pnpm audit --audit-level high')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format changed source files
        run: |
          cd frontend/web
          pnpm install --no-frozen-lockfile
          pnpm exec prettier --write \
            package.json \
            src/components/forms/fa-excel-import/index.vue \
            src/components/forms/fa-excel-export/index.vue
          cd ../../backend
          uv sync --frozen
          uv run ruff format tests/test_project_menu_seed.py

      - name: Verify SheetJS removal and lockfile determinism
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          web = Path('frontend/web')
          package = json.loads((web / 'package.json').read_text(encoding='utf-8'))
          assert 'xlsx' not in package.get('dependencies', {}), 'vulnerable xlsx dependency remains'
          pattern = re.compile(r'(?:from\s+|require\()\s*["\']xlsx["\']')
          offenders = []
          for path in (web / 'src').rglob('*'):
              if path.suffix not in {'.vue', '.ts', '.tsx', '.js'}:
                  continue
              if pattern.search(path.read_text(encoding='utf-8', errors='ignore')):
                  offenders.append(str(path))
          assert not offenders, f'SheetJS imports remain: {offenders}'
          PY
          cd frontend/web
          pnpm install --frozen-lockfile

      - name: Frontend typecheck, production build and full audit
        working-directory: frontend/web
        run: |
          pnpm run type-check
          pnpm run build:prod
          pnpm audit --audit-level high

      - name: Backend quality and security gates
        working-directory: backend
        run: |
          uv run ruff check --no-fix \
            app/api/v1/module_content \
            app/api/v1/module_membership \
            app/alembic/versions/20260822_01_caibuwailu_content_admin.py \
            app/scripts/initialize.py \
            tests/test_api_module_content.py \
            tests/test_project_menu_seed.py \
            app/init_app.py
          uv run ruff format --check \
            app/api/v1/module_content \
            app/api/v1/module_membership \
            app/alembic/versions/20260822_01_caibuwailu_content_admin.py \
            app/scripts/initialize.py \
            tests/test_api_module_content.py \
            tests/test_project_menu_seed.py \
            app/init_app.py
          uvx bandit -q -r \
            app/api/v1/module_content \
            app/api/v1/module_membership \
            app/scripts/initialize.py
          uv run pytest -q tests/test_api_module_content.py tests/test_project_menu_seed.py
          uv run pytest -q tests/test_main.py

      - name: SQLite migration round trip
        working-directory: backend
        env:
          ENVIRONMENT: dev
          DATABASE_TYPE: sqlite
          DATABASE_NAME: /tmp/caibuwailu_m2_repair
          SECRET_KEY: repair-only-secret-key
        run: |
          rm -f /tmp/caibuwailu_m2_repair.db
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini downgrade base
          uv run alembic -c alembic.ini upgrade head

      - name: Remove temporary repair automation
        run: |
          rm -f .github/workflows/one-time-frontend-supply-chain-repair.yml
          rm -f .github/workflows/one-time-m2-exceljs-security-repair.yml
          rm -f .github/scripts/m2_exceljs_security_repair.py

      - name: Commit only after all gates pass
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(web): replace vulnerable SheetJS and harden supply chain"
          git push origin HEAD:feature/caibuwailu-m2-membership
